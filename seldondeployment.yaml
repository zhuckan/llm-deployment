apiVersion: machinelearning.seldon.io/v1
kind: SeldonDeployment
metadata:
  name: llama-llm-seldon
  namespace: default
spec:
  predictors:
  - graph:
      name: llama-llm
      type: MODEL
      implementation: CUSTOM
      modelUri: llama-llm:local
      children: []
    name: default
    replicas: 1
